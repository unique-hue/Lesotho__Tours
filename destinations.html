<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesotho Tourism - Destinations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-custom" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Lesotho Tourism</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="destinations.html">Destinations</a></li>
            <li class="nav-item"><a class="nav-link" href="accommodation.html">Accommodation</a></li>
            <li class="nav-item"><a class="nav-link" href="activities.html">Activities</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact / Book</a></li>
          </ul>
          <button id="themeBtn" class="btn btn-warning ms-lg-3" type="button">Dark mode</button>
        </div>
      </div>
    </nav>
    <section class="page-title">
      <div class="container">
        <h1>Tourist Destinations</h1>
        <p class="mb-0">Search or filter to find your next stop.</p>
      </div>
    </section>
  </header>

  <main class="container mt-4">

    <section>
      <div class="row g-3 align-items-center mb-4">
        <div class="col-12 col-md-6">
          <label for="search" class="form-label visually-hidden">Search destinations</label>
          <input type="search" id="search" class="form-control" placeholder="Search destinations...">
        </div>
        <div class="col-12 col-md-6">
          <div class="btn-group" role="group" aria-label="Filter destinations">
            <button type="button" class="btn btn-brand filter-btn" data-category="All">All</button>
            <button type="button" class="btn btn-brand filter-btn" data-category="Nature">Nature</button>
            <button type="button" class="btn btn-brand filter-btn" data-category="Adventure">Adventure</button>
            <button type="button" class="btn btn-brand filter-btn" data-category="Culture">Culture</button>
          </div>
        </div>
      </div>

      <p id="resultCount" class="text-body-secondary"></p>

      <!-- Cards are added here by JavaScript -->
      <div id="destList" class="row g-4"></div>
    </section>

  </main>

  <footer>
    <div class="container text-center">
      <p class="mb-1">Lesotho Tourism - Student project for Web Design (BIWD2110)</p>
      <p class="mb-0"><a href="contact.html">Contact us</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
