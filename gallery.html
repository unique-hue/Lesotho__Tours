<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesotho Tourism - Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-custom" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Lesotho Tourism</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
            <li class="nav-item"><a class="nav-link" href="accommodation.html">Accommodation</a></li>
            <li class="nav-item"><a class="nav-link" href="activities.html">Activities</a></li>
            <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact / Book</a></li>
          </ul>
          <button id="themeBtn" class="btn btn-warning ms-lg-3" type="button">Dark mode</button>
        </div>
      </div>
    </nav>
    <section class="page-title">
      <div class="container">
        <h1>Photo Gallery</h1>
        <p class="mb-0">Click a photo to open it bigger.</p>
      </div>
    </section>
  </header>

  <main class="container mt-4">

    <!-- Thumbnails are added here by JavaScript -->
    <section>
      <div id="galleryGrid" class="row g-3"></div>
    </section>

    <!-- Lightbox (Bootstrap modal) -->
    <div class="modal fade" id="lightbox" tabindex="-1" aria-labelledby="lightboxTitle" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="lightboxTitle">Photo</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <img id="lightboxImg" src="" alt="" class="img-fluid">
          </div>
          <div class="modal-footer justify-content-between">
            <button type="button" id="prevBtn" class="btn btn-brand">Previous</button>
            <span id="counter"></span>
            <button type="button" id="nextBtn" class="btn btn-brand">Next</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <footer>
    <div class="container text-center">
      <p class="mb-1">Lesotho Tourism - Student project for Web Design (BIWD2110)</p>
      <p class="mb-0"><a href="contact.html">Contact us</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
